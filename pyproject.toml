[project]
name = "tm-discord-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate>=1.12.0",
    "beautifulsoup4>=4.14.3",
    "discord-py>=2.6.4",
    "docling>=2.68.0",
    "dotenv>=0.9.9",
    "emoji>=2.15.0",
    "ftfy>=6.3.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "pyarrow>=23.0.0",
    "requests>=2.32.5",
    "sentence-transformers>=5.2.0",
    "trafilatura>=2.0.0",
    "torch",
    "torchvision",
    "llama-cpp-python",
]

[tool.uv.sources]
df-common = { workspace = true }
torch = { path = "wheelhouse/dist/torch-2.9.1+cu130-cp313-cp313-manylinux_2_28_x86_64.whl" }
torchvision = { path = "wheelhouse/dist/torchvision-0.24.1+cu130-cp313-cp313-manylinux_2_28_x86_64.whl" }
llama-cpp-python = { path = "wheelhouse/dist/llama_cpp_python-0.3.21-py3-none-linux_x86_64.whl" }

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]